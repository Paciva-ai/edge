name: Edge Build Matrix

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            backend: backend-mlx
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            backend: backend-llamacpp
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            backend: backend-onnx-qnn
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            backend: backend-vllm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          echo "Building target ${{ matrix.target }} with backend ${{ matrix.backend }}"
